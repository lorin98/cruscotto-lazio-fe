# =============================================================================
# Intestazioni di sicurezza delle risposte statiche della SPA.
#
# Incluso in OGNI location che dichiara add_header propri: nginx non eredita gli
# add_header fra livelli, e una lista ripetuta a mano e' il modo in cui se ne perde una.
# Le risposte del backend (/api, /auth) non passano da qui: hanno le loro.
# `always`: anche sulle risposte di errore.
# =============================================================================

# CSP del README ("Deploy: header di sicurezza"), verificata dall'e2e e2e/csp.spec.ts:
# nessuno script o stile in linea, tooltip di ECharts disegnati nel canvas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# Clickjacking per i browser che non leggono frame-ancestors; stessi valori del backend.
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Ignorata dai browser su http (ambiente locale); vale quando davanti c'e' TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
